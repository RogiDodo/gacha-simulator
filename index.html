
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gacha Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Gacha Probability Simulator</h1>

    <div class="controls">

        <label for="chance">Chance de conseguir (%)</label>

        <input
            type="number"
            id="chance"
            value="10"
            min="0"
            max="100"
            step="0.1"
        >

        <label for="zoom">Número de tentativas: <span id="zoomValue">100</span></label>

        <input
            type="range"
            id="zoom"
            min="10"
            max="500"
            value="100"
            step="10"
        >

    </div>

    <div class="chart-container">
        <canvas id="grafico"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
